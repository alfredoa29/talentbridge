server.port=${PORT:8080}

# validate: validate the schema, makes no changes to the database.
# update: update the schema.
# create: creates the schema, destroying previous data.
# create-drop: drop the schema at the end of the session.
spring.jpa.hibernate.ddl-auto = ${SCHEMA}
###

spring.datasource.driver-class-name = org.postgresql.Driver
spring.datasource.url: ${JDBC_DATABASE_URL:}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.database-platform = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql = true

# =========================================
# SPRING AI - OPENAI CONFIGURATION
# =========================================
# Place your OpenAI API key here
spring.ai.openai.api-key=${OPENAI_KEY}
#spring.ai.anthropic.api-key=YOUR_ANTHROPIC_API_KEY
# Optional: Specify the model (defaults often work fine, e.g., gpt-3.5-turbo or gpt-4o)
spring.ai.openai.chat.options.model=${OPENAI_GPT_MODEL}

# =========================================
# SPRING AI - ANTHROPIC CONFIGURATION
# =========================================
spring.ai.anthropic.api-key=${ANTHROPIC_KEY}
spring.ai.anthropic.chat.options.max-tokens=${ANTHROPIC_TOKENS}

# =========================================
# CLOUDINARY CONFIGURATION
# =========================================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}



