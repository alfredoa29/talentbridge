spring.application.name=oprtuniapp


#spring.profiles.active=initlocal
#spring.profiles.active=dev

#spring.profiles.active=dev

spring.profiles.active=heroku
#spring.profiles.active=dockercompose

# Banner
spring.banner.location=banner.txt

# Webservice
# validate: validate the schema, makes no changes to the database.
# update: update the schema.
# create: creates the schema, destroying previous data.
# create-drop: drop the schema at the end of the session.
spring.jpa.hibernate.ddl-auto = update

#este liftime es para que azure no cierre la conexion antes que el frmwork hikari
spring.datasource.hikari.max-lifetime=240000

#log que dice cual properties esta leyendo spring
logging.level.org.springframework.boot.context.config=DEBUG


# mujltipart config
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# webservice
vs= v1
url.unsecure=${vs}/unsecure
url.users=${vs}/users
url.login=${url.users}/login
url.students=${vs}/students
url.studentRegister=${vs}/students/register
url.companies = ${vs}/companies
url.companyRegister=${vs}/companies/register
url.internships = ${vs}/internships
url.roles = ${vs}/roles
url.userRoles = ${vs}/user-roles
url.rolePrivs = ${vs}/role-privileges
url.privileges = ${vs}/privileges
url.applications = ${vs}/applications
url.interviews = ${vs}/interviews
url.curriculums = ${vs}/curriculums
url.countries = ${vs}/countries
url.areasofinterest = ${vs}/areasofinterest
url.genders   = ${vs}/genders
url.skills = ${vs}/skills
url.sectors = ${vs}/sectors